name: packsureai
description: Accessible packaged-product label scanning prototype for SIH 2026.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.5
  vibration: ^3.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
